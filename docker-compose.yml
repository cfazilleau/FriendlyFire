services:
  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TOKEN=${TOKEN}
      - MONGO_URI=${MONGO_URI}
    volumes:
      - ./config:/app/config
      - ./assets:/app/assets
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
